<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Skyline Rush — Low-Poly Flight Arcade</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="game" aria-label="Skyline Rush 3D flight game"></canvas>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <div class="hud-card mission-card">
      <div class="label">MISSION</div>
      <div id="hudMission" class="value strong">HARBOR HOP</div>
      <div id="hudObjective" class="sub">GATE 1 / 5</div>
    </div>
    <div class="hud-card timer-card">
      <div class="label">TIME REMAINING</div>
      <div id="hudTime" class="value big mono">02:45</div>
      <div class="timer-track"><div id="hudTimeBar" class="timer-fill"></div></div>
    </div>
    <div class="hud-card score-card">
      <div class="label">SCORE</div>
      <div id="hudScore" class="value big mono">000000</div>
      <div class="timer-track"><div id="hudHullBar" class="hull-fill"></div></div>
      <div id="hudHullText" class="sub strong-readout">AIRFRAME 100%</div>
      <div id="hudFuelText" class="sub strong-readout">FUEL 118 / 118 L</div>
      <div class="timer-track"><div id="hudFuelBar" class="fuel-fill"></div></div>
    </div>
  </div>

  <div class="hud-center">
    <div class="reticle">
      <div class="reticle-ring"></div>
      <div class="reticle-dot"></div>
      <div class="reticle-line left"></div>
      <div class="reticle-line right"></div>
    </div>
    <div id="hudWarning" class="warning hidden">STALL</div>
    <div id="hudMessage" class="flight-message"></div>
    <div id="hudTarget" class="target-bracket hidden"><span>NEXT GATE</span><b id="hudTargetDist">0 m</b></div>
  </div>

  <div class="hud-bottom">
    <div class="hud-card instrument-card">
      <div class="gauge-row"><span class="label">AIRSPEED</span><span id="hudSpeed" class="value mono">000 KT</span></div>
      <div class="gauge-row"><span class="label">ALTITUDE</span><span id="hudAlt" class="value mono">0000 FT</span></div>
      <div class="gauge-row"><span class="label">HEADING</span><span id="hudHeading" class="value mono">000°</span></div>
      <div class="gauge-row"><span class="label">VERTICAL</span><span id="hudVsi" class="value mono">+0000 FPM</span></div>
      <div class="gauge-row"><span class="label">FUEL</span><span id="hudFuelGauge" class="value mono">118 L</span></div>
    </div>
    <div class="minimap-wrap">
      <canvas id="minimap" width="180" height="180" aria-label="Tactical minimap"></canvas>
      <div class="minimap-label">TACTICAL MAP</div>
    </div>
    <div class="hud-card systems-card">
      <div class="throttle-row">
        <span class="label">THROTTLE</span>
        <div class="throttle-track"><div id="hudThrottleBar" class="throttle-fill"></div></div>
        <span id="hudThrottle" class="value mono">55%</span>
      </div>
      <div class="status-row">
        <span id="hudGear" class="chip on">GEAR DOWN</span>
        <span id="hudFlaps" class="chip">FLAPS UP</span>
        <span id="hudCamera" class="chip cyan">CHASE VIEW</span>
      </div>
      <div class="status-row"><span id="hudWind" class="chip">WIND 0.0</span><span class="chip dim">H HELP · P PAUSE</span></div>
    </div>
  </div>
</div>

<div id="notice" class="notice"></div>
<div id="overlay" class="overlay"></div>
<p id="status" role="status" aria-live="polite" class="sr-only"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
